# SMM Control Center Release Pipeline
name: 'Release'

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install

      - name: Setup Rust (pinned 1.95.0)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri'

      - name: Enable updater artifacts for release
        run: node -e "const fs = require('fs'); const p = 'src-tauri/tauri.conf.json'; const c = JSON.parse(fs.readFileSync(p, 'utf8')); c.bundle.createUpdaterArtifacts = true; fs.writeFileSync(p, JSON.stringify(c, null, 2));"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: v__VERSION__
          releaseName: 'SMM Control Center v__VERSION__'
          releaseBody: |
            ### Обновления
            - Автообновление теперь: скачивание → установка → перезапуск → подтверждение успеха с показом списка изменений
            - Версия в шапке читается из установленного бинарника и корректно меняется после апдейта

            ### Возможности
            - Telegram: длинные посты публикуются как статьи (Rich Messages, Bot API 10.1); переключатель «Пост / Статья», Markdown-редактор с превью
            - Медиавложения: VK (wall photo) и Telegram (sendPhoto / sendMediaGroup)
            - Платформа OK (Одноклассники): публикация через mediatopic.post
            - Живой индикатор состояния фоновых воркеров
            - Модальные подтверждения удаления вместо нативных диалогов
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
